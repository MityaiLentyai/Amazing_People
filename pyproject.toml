[project]
name = "mazegen"
version = "0.1.0"
description = "Reusable maze generation and solving library"
readme = "README.md"
requires-python = ">=3.10"
license-files = ["LICENSE.md"]
dependencies = []

[dependency-groups]
dev = [
    "mlx",
    "pydantic==2.14.4",
]

[build-system]
requires = ["uv_build>=0.13.5,<0.14.0"]
build-backend = "uv_build"

[tool.uv.build-backend]
module-name = "mazegen"
module-root = "src"

[tool.uv.sources]
mlx = { path = "mlx-2.2/ubuntu/mlx-2.2-py3-none-any.whl" }
