[project]
name = "mazegen"
version = "0.1.0"
description = "Create and visualize a maze"
readme = "README.md"
requires-python = ">=3.10"
license-files = ["LICENSE.md"]
dependencies = [
    "mlx",
    "pydantic==2.14.3",
]

[build-system]
requires = ["uv_build>=0.13.5,<0.14.0"]
build-backend = "uv_build"

[tool.uv.build-backend]
module-name = "src"
module-root = ""

[tool.uv.sources]
mlx = { path = "libs/mlx-2.2-py3-none-any.whl" }