[project]
name = "a-maze-ing-guys"
version = "0.1.0"
description = "Create and visualize a maze"
readme = "README.md"
requires-python = ">=3.14"
dependencies = [
    "pydantic>=2.13.5",
]

[project.scripts]
a-maze-ing = "a_maze_ing:main"

[build-system]
requires = ["uv_build>=0.13.5,<0.14.0"]
build-backend = "uv_build"

[tool.uv.build-backend]
module-name = "a_maze_ing"
